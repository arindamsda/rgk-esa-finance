// ── PRINT UTILITY — no popup, works on Android/iOS/Windows ───────────────
function rgkPrint(elementId, title) {
  var el = document.getElementById(elementId);
  if (!el) { alert('Print area not found. Please try again.'); return; }
  var portal = document.getElementById('__rgk_portal');
  if (!portal) {
    portal = document.createElement('div');
    portal.id = '__rgk_portal';
    document.body.appendChild(portal);
  }
  var prevTitle = document.title;
  portal.innerHTML = el.innerHTML;
  document.title = title;
  var restore = function() {
    document.title = prevTitle;
    portal.innerHTML = '';
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 30000);
  window.print();
}

// ── EXCEL SAVE — mobile-safe (Android + iOS) ─────────────────────────────
function xlsxSave(wb, filename) {
  try {
    XLSX.writeFile(wb, filename);
  } catch(e) {
    try {
      var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      var blob = new Blob([out], {type:'application/octet-stream'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 3000);
    } catch(e2) { alert('Download failed. Try on a desktop browser for Excel export.'); }
  }
}

const hashPwd = s => { let h=0; for(let c of s+"RGK_ESA_1932_SALT"){h=Math.imul(31,h)+c.charCodeAt(0)|0;} return (h>>>0).toString(36)+"_v1"; };

const todayISO = () => new Date().toISOString().slice(0,10);
const fmtD = d => d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"";
const fmtM = n => "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function n2w(n){n=Math.floor(n);if(!n)return"Zero";let s="";if(n>=1e7){s+=n2w(Math.floor(n/1e7))+" Crore ";n%=1e7;}if(n>=1e5){s+=n2w(Math.floor(n/1e5))+" Lakh ";n%=1e5;}if(n>=1000){s+=n2w(Math.floor(n/1000))+" Thousand ";n%=1000;}if(n>=100){s+=ONES[Math.floor(n/100)]+" Hundred ";n%=100;}if(n>0)s+=n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");return s.trim();}
const amtWords = n=>{const a=+n,r=Math.floor(a),p=Math.round((a-r)*100);return n2w(r)+" Rupees"+(p?" and "+n2w(p)+" Paise":"")+" Only";};

// ── TREASURER SETUP ───────────────────────────────────────────────────────
function TreasurerSetup({store,persist,onDone}) {
  const [nm,setNm]=useState(""); const [pw,setPw]=useState(""); const [cf,setCf]=useState(""); const [er,setEr]=useState("");
  const submit = () => {
    if(!nm.trim()) return setEr("Treasurer name is required");
    if(pw.length<6) return setEr("Password must be at least 6 characters");
    if(pw!==cf) return setEr("Passwords do not match");
    persist({...store,treasurer:{id:"treasurer",name:nm.trim(),passwordHash:hashPwd(pw)}});
    onDone();
  };
  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-900 flex flex-col items-center justify-center p-4">

          <p className="text-blue-400 text-xs mt-1 tracking-widest uppercase">Financial Management System</p>
        </div>
        <div className="bg-white rounded-3xl shadow-2xl p-6">
          <div className="bg-amber-50 border-l-4 border-amber-400 rounded-xl p-3 mb-5">
            <p className="text-amber-800 font-bold text-sm">⚡ First Time Setup</p>
            <p className="text-amber-700 text-xs mt-0.5">Register the Treasurer to activate the system.</p>
          </div>
          <h2 className="font-bold text-blue-950 text-base mb-4 flex items-center gap-2">
            <span className="w-7 h-7 bg-blue-800 text-white rounded-full flex items-center justify-center text-xs font-bold">T</span>
            Treasurer Registration
          </h2>
          <div className="space-y-3">
            <Inp label="Treasurer's Full Name" value={nm} onChange={e=>setNm(e.target.value)} req ph="Enter full name"/>
            <PwdInp label="Create Password (min 6 chars)" value={pw} onChange={e=>setPw(e.target.value)} req/>
            <PwdInp label="Confirm Password" value={cf} onChange={e=>setCf(e.target.value)} req/>
            {er&&<p className="text-red-600 text-xs bg-red-50 border border-red-200 p-2 rounded-xl">{er}</p>}
            <Btn onClick={submit} color="blue" cls="w-full justify-center py-3 text-sm mt-2">Initialize System →</Btn>
            <button type="button" onClick={()=>window.location.reload()}
              className="w-full py-2.5 border-2 border-gray-300 text-gray-500 font-semibold rounded-xl hover:bg-gray-50 text-sm transition flex items-center justify-center gap-2">
              🔄 Refresh Page
            </button>

// ── LOGIN PAGE ────────────────────────────────────────────────────────────
function LoginPage({store,persist,onLogin,showToast}) {
  const [selId,setSelId]=useState(""); const [pw,setPw]=useState(""); const [er,setEr]=useState(""); const [showReg,setShowReg]=useState(false); const [showPw,setShowPw]=useState(false);

  const treasurer = store.treasurer || null;
  const members = Array.isArray(store.users) ? store.users : [];
  const allUsers = [
    ...(treasurer ? [{id:"treasurer",name:treasurer.name+" (Treasurer)"}] : []),
    ...members.map(u=>({id:u.id,name:u.name})),
  ];

  const doLogin = () => {
    setEr("");
    try {
      if(!selId){setEr("Please select your name from the list");return;}
      if(!pw){setEr("Please enter your password");return;}
      if(selId==="treasurer"){
        if(!treasurer){setEr("Treasurer not found. Please reload.");return;}
        if(hashPwd(pw)===treasurer.passwordHash) onLogin({id:"treasurer",name:treasurer.name,role:"treasurer"});
        else setEr("Incorrect password. Please try again.");
      } else {
        const user=members.find(u=>u.id===selId);
        if(!user){setEr("User not found. Please reload.");return;}
        if(hashPwd(pw)===user.passwordHash) onLogin({id:user.id,name:user.name,role:"user"});
        else setEr("Incorrect password. Please try again.");
      }
    } catch(e){setEr("Login error: "+(e.message||"Unknown error"));}
  };

  const handleKey = e => { if(e.key==="Enter") doLogin(); };

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-900 flex flex-col items-center justify-center p-4">
      <div className="w-full max-w-sm animate-fadein">
        <div className="flex flex-col items-center mb-6 text-center">
          <div className="p-3 bg-white/10 rounded-full mb-3 border-2 border-blue-400/30"><Logo sz={70}/></div>
          <h1 className="text-white font-bold text-xl font-display">R. G. KAR MEDICAL COLLEGE</h1>
          <p className="text-blue-300 font-semibold text-sm">EX-STUDENTS' ASSOCIATION</p>
          <p className="text-blue-400 text-xs mt-1 tracking-widest uppercase">Financial Management System</p>
        </div>
        <div className="bg-white rounded-3xl shadow-2xl p-6">
          <h2 className="font-bold text-blue-950 text-base mb-4">🔐 Member Login</h2>
          <div className="space-y-3">
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Select User <span className="text-red-500">*</span></label>
              <select value={selId} onChange={e=>{setSelId(e.target.value);setEr("");}} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <option value="">-- Select your name --</option>
                {allUsers.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
              {allUsers.length===0&&<p className="text-orange-500 text-xs mt-1">⚠️ No users found. Please reload.</p>}
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1">Password <span className="text-red-500">*</span></label>
              <div className="relative">
                <input type={showPw?"text":"password"} value={pw} onChange={e=>{setPw(e.target.value);setEr("");}} onKeyDown={handleKey} placeholder="Enter your password"
                  className="w-full border border-gray-300 rounded-xl px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
                <button type="button" onClick={()=>setShowPw(s=>!s)} tabIndex={-1} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-700 transition">
                  {showPw?<EyeOff size={16}/>:<Eye size={16}/>}
                </button>
              </div>
            </div>
            {er&&<div className="text-red-600 text-xs bg-red-50 border border-red-200 p-2 rounded-xl flex items-center gap-2"><span>⚠️</span><span>{er}</span></div>}
            <button type="button" onClick={doLogin} className="w-full py-3 bg-gradient-to-r from-blue-800 to-blue-600 hover:from-blue-900 hover:to-blue-700 text-white font-bold rounded-xl shadow transition text-sm">
              Login →
            </button>
          </div>
          <div className="mt-4 pt-4 border-t border-gray-100 space-y-2">
            <button type="button" onClick={()=>setShowReg(true)} className="w-full py-2.5 border-2 border-blue-600 text-blue-700 font-bold rounded-xl hover:bg-blue-50 text-sm transition">+ Register as New Member</button>
            <button type="button" onClick={()=>window.location.reload()}
              className="w-full py-2.5 border-2 border-gray-300 text-gray-500 font-semibold rounded-xl hover:bg-gray-50 text-sm transition flex items-center justify-center gap-2">
              🔄 Refresh Page
            </button>
          </div>
        </div>
        <p className="text-blue-500 text-xs text-center mt-4">Sessions auto-expire when you leave the app</p>
      </div>
      {showReg&&<RegModal store={store} persist={persist} onClose={()=>setShowReg(false)} showToast={showToast}/>}
    </div>
  );
}

function RegModal({store,persist,onClose,showToast}) {
  const [nm,setNm]=useState(""); const [pw,setPw]=useState(""); const [cf,setCf]=useState(""); const [er,setEr]=useState("");
  const submit = () => {
    if(!nm.trim()) return setEr("Name is required");
    if(pw.length<6) return setEr("Password must be at least 6 characters");
    if(pw!==cf) return setEr("Passwords do not match");
    if(store.users.some(u=>u.name.toLowerCase()===nm.trim().toLowerCase())||store.treasurer?.name.toLowerCase()===nm.trim().toLowerCase()) return setEr("Name already exists");
    persist({...store,users:[...store.users,{id:uid(),name:nm.trim(),passwordHash:hashPwd(pw)}]});
    showToast("Registration successful! You may now login.");
    onClose();
  };
  return (
    <Mdl title="Register New Member" onClose={onClose}>
      <div className="space-y-3">
        <Inp label="Full Name" value={nm} onChange={e=>setNm(e.target.value)} req ph="Enter your full name"/>
        <PwdInp label="Create Password (min 6 characters)" value={pw} onChange={e=>setPw(e.target.value)} req/>
        <PwdInp label="Confirm Password" value={cf} onChange={e=>setCf(e.target.value)} req/>
        {er&&<p className="text-red-600 text-xs bg-red-50 border border-red-200 p-2 rounded-xl">{er}</p>}
        <div className="flex gap-2 pt-1">
          <button onClick={onClose} className="flex-1 py-2 border border-gray-300 rounded-xl text-gray-600 text-sm hover:bg-gray-50 transition">Cancel</button>
          <Btn onClick={submit} color="blue" cls="flex-1 justify-center">Register</Btn>
        </div>
        <button type="button" onClick={()=>window.location.reload()}
          className="w-full py-2.5 border-2 border-gray-300 text-gray-500 font-semibold rounded-xl hover:bg-gray-50 text-sm transition flex items-center justify-center gap-2">
          🔄 Refresh Page
        </button>
      </div>
    </Mdl>
  );
}

// ── TRANSACTION FORM ──────────────────────────────────────────────────────
function TxnForm({fund,type,store,persist,currentUser,showToast,editData,onClose}) {
  const heads=type==="income"?(fund==="ESA"?ESA_INC_HEADS:RUN_INC_HEADS):(fund==="ESA"?ESA_EXP_HEADS:RUN_EXP_HEADS);
  const [hd,setHd]=useState(editData?.head||""); const [sh,setSh]=useState(editData?.subHead||"");
  const [pn,setPn]=useState(editData?.partyName||""); const [am,setAm]=useState(editData?.amount||"");
  const [md,setMd]=useState(editData?.mode||""); const [dt,setDt]=useState(editData?.date||todayISO());
  const [er,setEr]=useState("");
  const isInter=hd in INTER_PARTY;
  useEffect(()=>{if(hd in INTER_PARTY)setPn(INTER_PARTY[hd]);},[hd]);
  const dtWarn=dt&&dt!==todayISO();
  const submit=()=>{
    if(!hd) return setEr("Please select a head");
    if(!pn.trim()) return setEr(`Please enter ${type==="income"?"payer":"payee"} name`);
    if(!am||isNaN(+am)||+am<=0) return setEr("Please enter a valid positive amount");
    if(!md) return setEr("Please select mode of transaction");
    if(!dt) return setEr("Please enter date");
    const t={id:editData?.id||uid(),fund,type,head:hd,subHead:sh,partyName:pn.trim(),amount:+am,mode:md,date:dt,enteredBy:editData?.enteredBy||currentUser.id,enteredByName:editData?.enteredByName||currentUser.name,enteredAt:editData?.enteredAt||new Date().toISOString(),modifiedBy:editData?currentUser.id:null,modifiedByName:editData?currentUser.name:null,modifiedAt:editData?new Date().toISOString():null};
    const txns=editData?store.transactions.map(x=>x.id===editData.id?t:x):[...store.transactions,t];
    persist({...store,transactions:txns});
    showToast(editData?"Entry updated!":"Entry saved successfully!");
    onClose();
  };
  return (
    <div className="space-y-3">
      <Sel label={type==="income"?"Income Head":"Expense Head"} value={hd} onChange={e=>setHd(e.target.value)} opts={heads} req/>
      {type==="expense"&&<Inp label="Sub-type (Optional)" value={sh} onChange={e=>setSh(e.target.value)} ph="e.g. specific description"/>}
      <Inp label={type==="income"?"Received From":"Paid To"} value={pn} onChange={e=>setPn(e.target.value)} req ph="Name of person or organization" dis={isInter}/>
      {isInter&&<p className="text-blue-600 text-xs bg-blue-50 border border-blue-200 p-2 rounded-xl">ℹ️ Party name is auto-set for inter-fund transfers.</p>}
      <div>
        <label className="block text-xs font-semibold text-gray-600 mb-1">Amount (₹) <span className="text-red-500">*</span></label>
        <div className="relative">
          <span className="absolute left-3 top-2.5 text-gray-500 font-semibold text-sm">₹</span>
          <input type="number" min="0.01" step="0.01" value={am} onChange={e=>setAm(e.target.value)} placeholder="0.00" className="w-full border border-gray-300 rounded-xl pl-7 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        {am&&+am>0&&<p className="text-xs text-gray-400 mt-1 italic pl-1">{amtWords(am)}</p>}
      </div>
      <Sel label="Mode of Transaction" value={md} onChange={e=>setMd(e.target.value)} opts={MODES} req/>
      <div>
        <Inp label="Date" type="date" value={dt} onChange={e=>setDt(e.target.value)} req/>
        {dtWarn&&<div className="mt-1 flex items-start gap-2 bg-amber-50 border border-amber-300 rounded-xl p-2"><TriAlert size={14} className="text-amber-500 mt-0.5 flex-shrink-0"/><p className="text-amber-700 text-xs">⚠️ Date differs from today. Please verify the actual transaction date.</p></div>}
      </div>
      {er&&<p className="text-red-600 text-xs bg-red-50 border border-red-200 p-2 rounded-xl">{er}</p>}
      <div className="flex gap-2 pt-1">
        <button onClick={onClose} className="flex-1 py-2 border border-gray-300 rounded-xl text-gray-600 text-sm hover:bg-gray-50 transition">Cancel</button>
        <Btn onClick={submit} color={type==="income"?"green":"red"} cls="flex-1 justify-center py-2.5">{editData?"Update":"Save"} Entry</Btn>
      </div>
    </div>
  );
}

  const canEdit=t=>currentUser.role==="treasurer"||t.enteredBy===currentUser.id;
  const total=txns.reduce((s,t)=>s+t.amount,0);

  const doDelete=t=>{persist({...store,transactions:store.transactions.filter(x=>x.id!==t.id)});showToast("Entry deleted");setDelT(null);};
  if(!txns.length) return <div className="text-center py-10 text-gray-400"><p className="text-4xl mb-2">{isInc?"📭":"📪"}</p><p className="text-sm">No {type} entries{filter.from||filter.to?" in selected date range":""}</p></div>;

          <tbody>
            {txns.map((t,i)=>(
              <tr key={t.id} className={`${i%2===0?"bg-white":"bg-gray-50"} hover:bg-blue-50 transition`} title={`Entered by: ${t.enteredByName}`}>
                <td className="px-3 py-2 whitespace-nowrap">{fmtD(t.date)}</td>
                <td className="px-3 py-2 max-w-[100px]"><span className="truncate block">{t.head}</span></td>
                <td className="px-3 py-2 hidden md:table-cell text-gray-400">{t.subHead||"—"}</td>

// ── VOUCHERS PAGE ─────────────────────────────────────────────────────────
function VouchersPage({store,currentUser,showToast}) {
  const [printV,setPrintV]=useState(null); const [clubQ,setClubQ]=useState(null);
  const expenses=store.transactions.filter(t=>t.type==="expense").sort((a,b)=>b.date.localeCompare(a.date));
  const genVouchers=txns=>{
    const groups={};
    txns.forEach(t=>{const k=`${t.partyName}|||${t.mode}`;if(!groups[k])groups[k]=[];groups[k].push(t);});
    const vouchers=[];
    Object.values(groups).forEach(grp=>{
      const total=grp.reduce((s,t)=>s+t.amount,0);
      const allSalary=grp.every(t=>t.head==="Salary");
      if(total>10000&&!allSalary){
        let cur=[],curTot=0;
        for(const t of grp){
          let rem=t.amount;
          while(rem>0){
            const avail=10000-curTot;
            if(avail<=0){vouchers.push(cur);cur=[];curTot=0;continue;}
            const take=Math.min(rem,10000-curTot);
            cur.push({...t,amount:take,_partial:t.amount!==take});
            curTot+=take;rem-=take;
            if(curTot>=10000){vouchers.push(cur);cur=[];curTot=0;}
          }
        }
        if(cur.length)vouchers.push(cur);
      } else {vouchers.push(grp);}
    });
    return vouchers;
  };
  const handleGen=txn=>{
    const related=expenses.filter(t=>t.id!==txn.id&&t.partyName===txn.partyName&&t.mode===txn.mode);
    const clubTotal=[txn,...related].reduce((s,t)=>s+t.amount,0);
    if(related.length>0&&clubTotal<=10000){setClubQ({txn,related,clubTotal});}
    else{setPrintV(genVouchers([txn]));}
  };
  const handleClub=club=>{setPrintV(genVouchers(club?[clubQ.txn,...clubQ.related]:[clubQ.txn]));setClubQ(null);};
  return (
    <div className="p-3 md:p-5 max-w-6xl mx-auto animate-fadein safe-bottom">
      <div className="mb-4"><h2 className="text-2xl font-bold text-blue-950 font-display">🧾 Payment Vouchers</h2><p className="text-gray-500 text-sm">Generate payment vouchers for expense entries</p></div>
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-4 flex items-start gap-2">
        <span className="text-amber-500 text-lg">💡</span>
        <div className="text-xs text-amber-800"><p className="font-semibold">Voucher Rules:</p><p>• ≤ ₹10,000: single voucher &nbsp;|&nbsp; &gt; ₹10,000 (except Salary): auto-split into multiple ₹10,000 vouchers</p><p>• Same payee + same mode with total ≤ ₹10,000: you'll be asked to club or keep separate</p></div>
      </div>
      <div className="bg-white rounded-3xl shadow-lg overflow-hidden border border-gray-100">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead className="bg-gray-100 text-gray-600"><tr>
              <th className="px-3 py-2.5 text-left">Date</th><th className="px-3 py-2.5 text-left">Fund</th><th className="px-3 py-2.5 text-left">Expense Head</th><th className="px-3 py-2.5 text-left">Paid To</th>
              <th className="px-3 py-2.5 text-left hidden md:table-cell">Mode</th><th className="px-3 py-2.5 text-right">Amount</th><th className="px-3 py-2.5 text-center">Action</th>
            </tr></thead>
            <tbody>
              {expenses.map((t,i)=>(
                <tr key={t.id} className={`${i%2===0?"bg-white":"bg-gray-50"} hover:bg-blue-50 transition`}>
                  <td className="px-3 py-2">{fmtD(t.date)}</td>
                  <td className="px-3 py-2"><span className={`px-2 py-0.5 rounded-lg font-medium text-xs ${t.fund==="ESA"?"bg-blue-100 text-blue-700":"bg-purple-100 text-purple-700"}`}>{t.fund==="ESA"?"ESA":"Reunion"}</span></td>
                  <td className="px-3 py-2">{t.head}</td><td className="px-3 py-2">{t.partyName}</td>
                  <td className="px-3 py-2 hidden md:table-cell text-gray-500">{t.mode}</td>
                  <td className="px-3 py-2 text-right font-semibold text-red-700">{fmtM(t.amount)}</td>
                  <td className="px-3 py-2 text-center"><button onClick={()=>handleGen(t)} className="px-3 py-1.5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-xs font-bold transition">Generate</button></td>
                </tr>
              ))}
              {!expenses.length&&<tr><td colSpan={7} className="text-center py-10 text-gray-400">No expense entries available.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      {clubQ&&<Mdl title="Club Payments?" onClose={()=>setClubQ(null)}>
        <div className="text-center">
          <div className="text-5xl mb-3">🤝</div>
          <p className="font-bold text-gray-800 mb-2">Found {clubQ.related.length} other payment(s) to <strong className="text-blue-800">{clubQ.txn.partyName}</strong></p>
          <p className="text-sm text-gray-600 mb-1">Via <strong>{clubQ.txn.mode}</strong> | Total: <strong className="text-green-700">{fmtM(clubQ.clubTotal)}</strong></p>
          <p className="text-xs text-gray-400 mb-5">Club all into one voucher?</p>
          <div className="flex gap-2"><button onClick={()=>handleClub(false)} className="flex-1 py-2.5 border-2 border-gray-300 rounded-xl text-sm font-semibold">Separate</button><Btn color="blue" cls="flex-1 justify-center" onClick={()=>handleClub(true)}>Club Into One</Btn></div>
        </div>
      </Mdl>}

      {/* Full-screen voucher viewer — sticky header + scrollable content + sticky print bar */}
      {printV&&(
        <div className="fixed inset-0 z-50 flex flex-col np" style={{background:"rgba(0,0,0,0.75)"}}>
          <div className="flex-shrink-0 flex items-center justify-between bg-gradient-to-r from-blue-950 to-blue-800 text-white px-4 py-3 shadow-xl">
            <div>
              <h3 className="font-bold text-sm md:text-base">🧾 Payment Voucher{printV.length>1?"s":""}</h3>
              {printV.length>1&&<p className="text-blue-300 text-xs">{printV.length} vouchers — scroll to view all</p>}
            </div>
            <button onClick={()=>setPrintV(null)} className="p-2 hover:bg-blue-700 rounded-full transition ml-3"><XIcon size={20}/></button>
          </div>
          <div className="flex-1 overflow-y-auto bg-gray-200 p-3 md:p-6">
            <div id="voucher-print-area">
              {printV.map((grp,i)=><Voucher key={i} txns={grp} vNum={i+1} vTotal={printV.length}/>)}
            </div>
          </div>
          <div className="flex-shrink-0 bg-white border-t-2 border-gray-300 px-4 py-3 flex items-center gap-3 shadow-2xl">
            <p className="flex-1 text-gray-400 text-xs hidden md:block">💡 In Print dialog, choose <strong>"Save as PDF"</strong> as destination.</p>
            <button onClick={()=>setPrintV(null)} className="px-4 py-2.5 border-2 border-gray-300 rounded-xl text-sm font-semibold hover:bg-gray-50 transition whitespace-nowrap">✕ Close</button>
            <button onClick={()=>rgkPrint("voucher-print-area","Payment Voucher — RGK ESA")} className="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-red-700 to-red-500 hover:from-red-800 hover:to-red-600 text-white font-bold rounded-xl shadow-lg text-sm transition whitespace-nowrap">
              <Printer size={18}/> Print / Save PDF
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function SettingsPage({store,persist,showToast}) {
  const [nm,setNm]=useState(store.treasurer?.name||""); const [pw,setPw]=useState(""); const [cf,setCf]=useState(""); const [er,setEr]=useState("");
  const submit=()=>{
    if(!nm.trim()) return setEr("Name is required");
    if(pw&&pw.length<6) return setEr("Password must be at least 6 characters");
    if(pw&&pw!==cf) return setEr("Passwords do not match");
    const newTreas={...store.treasurer,name:nm.trim()};
    if(pw)newTreas.passwordHash=hashPwd(pw);
    persist({...store,treasurer:newTreas});
    showToast("Settings saved!");
    setPw("");setCf("");setEr("");
  };
  return (
    <div className="p-3 md:p-5 max-w-2xl mx-auto animate-fadein safe-bottom">
      <h2 className="text-2xl font-bold text-blue-950 mb-5 font-display">⚙️ Treasurer Settings</h2>
      <div className="bg-white rounded-3xl shadow-lg p-5 mb-4 border border-gray-100">
        <h3 className="font-bold text-gray-700 mb-4">Update Treasurer Details</h3>
        <div className="space-y-3">
          <Inp label="Treasurer's Name" value={nm} onChange={e=>setNm(e.target.value)} req/>
          <PwdInp label="New Password (blank = keep current)" value={pw} onChange={e=>setPw(e.target.value)} ph="Enter new password"/>
          {pw&&<PwdInp label="Confirm New Password" value={cf} onChange={e=>setCf(e.target.value)}/>}
          {er&&<p className="text-red-600 text-xs bg-red-50 border border-red-200 p-2 rounded-xl">{er}</p>}
          <Btn onClick={submit} color="blue" cls="w-full justify-center py-3">Save Settings</Btn>
        </div>
      </div>
      <div className="bg-white rounded-3xl shadow-lg p-5 border border-gray-100">
        <h3 className="font-bold text-gray-700 mb-3">Registered Members ({store.users.length})</h3>
        {!store.users.length&&<p className="text-gray-400 text-sm py-3 text-center">No members registered yet</p>}
        <div className="space-y-2">
          {store.users.map(u=>(
            <div key={u.id} className="flex items-center justify-between bg-gray-50 hover:bg-gray-100 transition rounded-xl px-3 py-2.5">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-sm">{u.name.charAt(0)}</span>
                <span className="text-sm font-medium text-gray-700">{u.name}</span>
              </div>
              <button onClick={()=>{if(window.confirm(`Remove "${u.name}"? Their data is preserved.`)){persist({...store,users:store.users.filter(x=>x.id!==u.id)});showToast("Member removed");}}} className="p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition"><Trash2 size={14}/></button>
            </div>
          ))}
        </div>
        {store.users.length>0&&<div className="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl"><p className="text-xs text-amber-700">⚠️ Removing a member only prevents login. Their transaction data remains intact.</p></div>}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App() {
  const [store,setStore]=useState(loadS);
  const [phase,setPhase]=useState(()=>loadS().treasurer?"login":"setup");
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [toast,setToast]=useState(null);

  const persist=useCallback(d=>{setStore(d);saveS(d);},[]);
  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500);},[]);

  useEffect(()=>{
    const onVis=()=>{if(document.visibilityState==="hidden"&&user){setUser(null);setPhase("login");setPage("dashboard");}};
    document.addEventListener("visibilitychange",onVis);
    return()=>document.removeEventListener("visibilitychange",onVis);
  },[user]);

  const balances=useMemo(()=>{
    const c=(f,t)=>store.transactions.filter(x=>x.fund===f&&x.type===t).reduce((s,x)=>s+x.amount,0);
    const [ei,ee,ri,re]=[c("ESA","income"),c("ESA","expense"),c("REUNION","income"),c("REUNION","expense")];
    return{esaIncome:ei,esaExpense:ee,esaBalance:ei-ee,reunionIncome:ri,reunionExpense:re,reunionBalance:ri-re,totalBalance:(ei-ee)+(ri-re)};
  },[store.transactions]);

  return (
    <>
      {phase==="setup"&&<TreasurerSetup store={store} persist={persist} onDone={()=>setPhase("login")}/>}
      {phase==="login"&&<LoginPage store={store} persist={persist} onLogin={u=>{setUser(u);setPhase("app");}} showToast={showToast}/>}
      {phase==="app"&&(
        <div className="min-h-screen bg-gray-100 flex flex-col">
          <AssocHeader user={user} onLogout={()=>{setUser(null);setPhase("login");setPage("dashboard");}} onNav={setPage} page={page}/>
          {toast&&<Toast msg={toast.msg} type={toast.type}/>}
          <main className="flex-1 overflow-auto">
            {page==="dashboard"&&<Dashboard balances={balances} setPage={setPage}/>}
            {page==="esa"&&<FundPage fund="ESA" store={store} persist={persist} currentUser={user} showToast={showToast}/>}
            {page==="reunion"&&<FundPage fund="REUNION" store={store} persist={persist} currentUser={user} showToast={showToast}/>}
            {page==="balance"&&<BalanceSheet store={store}/>}
            {page==="reports"&&<Reports store={store}/>}
            {page==="vouchers"&&<VouchersPage store={store} currentUser={user} showToast={showToast}/>}
            {page==="settings"&&user.role==="treasurer"&&<SettingsPage store={store} persist={persist} showToast={showToast}/>}
          </main>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
// ── PWA SETUP ─────────────────────────────────────────────────────────────

// Generate app icon via canvas
function makeIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const s = size;

  // Outer circle (blue)
  ctx.fillStyle = "#1e3a8a";
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI*2);
  ctx.fill();

  // Border ring
  ctx.strokeStyle = "#93c5fd";
  ctx.lineWidth = s * 0.025;
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2 * 0.94, 0, Math.PI*2);
  ctx.stroke();

  // Inner ring
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = s * 0.012;
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2 * 0.80, 0, Math.PI*2);
  ctx.stroke();

  // Flames
  const flames = 8;
  const startX = s * 0.22;
  const endX   = s * 0.78;
  const gap    = (endX - startX) / (flames - 1);
  for (let i = 0; i < flames; i++) {
    const x = startX + i * gap;
    const ry = i % 2 === 0 ? s * 0.09 : s * 0.07;
    ctx.fillStyle = i % 2 === 0 ? "white" : "#bfdbfe";
    ctx.globalAlpha = i % 2 === 0 ? 1 : 0.8;
    ctx.beginPath();
    ctx.ellipse(x, s * 0.43, s * 0.03, ry, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Base bars
  ctx.fillStyle = "white";
  [
    [s*0.18, s*0.54, s*0.64, s*0.07, s*0.025],
    [s*0.22, s*0.61, s*0.56, s*0.05, s*0.015],
    [s*0.28, s*0.66, s*0.44, s*0.04, s*0.01],
  ].forEach(([x,y,w,h,r]) => {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(x, y, w, h, r);
    } else {
      ctx.rect(x, y, w, h);
    }
    ctx.fill();
  });

  // "ESA" text
  ctx.fillStyle = "#93c5fd";
  ctx.font = `bold ${s*0.1}px Georgia,serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("ESA", s/2, s*0.83);

  return c.toDataURL("image/png");
}

// Build and inject PWA manifest
function setupPWA() {
  // Manifest is now a static file — nothing to do here
}

// Register service worker
function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("./sw.js", { scope: "./" })
    .then(r => console.log("[PWA] SW registered, scope:", r.scope))
    .catch(e => console.warn("[PWA] SW registration failed:", e));
}

// Install prompt (Android / Windows / Chrome desktop)
let deferredPrompt = null;
function setupInstallPrompt() {
  const banner = document.getElementById("install-banner");
  const doInstall = document.getElementById("do-install");
  const dismiss  = document.getElementById("dismiss-install");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add("show");
  });

  doInstall && doInstall.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove("show");
  });

  dismiss && dismiss.addEventListener("click", () => banner.classList.remove("show"));

  window.addEventListener("appinstalled", () => {
    banner.classList.remove("show");
    console.log("[PWA] App installed!");
  });
}

// iOS "Add to Home Screen" nudge
function setupIOSGuide() {
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true;

  if (isIOS && !isStandalone) {
    const shown = sessionStorage.getItem("ios-guide-shown");
    if (!shown) {
      setTimeout(() => {
        document.getElementById("ios-banner").style.display = "block";
        sessionStorage.setItem("ios-guide-shown", "1");
      }, 4000);
    }
  }
}

// Boot
setupPWA();
registerSW();
setupInstallPrompt();
setupIOSGuide();
</script>
